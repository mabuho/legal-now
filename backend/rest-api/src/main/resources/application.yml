spring:
  application:
    name: legal-now-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/legalnow}
    username: ${SPRING_DATASOURCE_USERNAME:legalnow}
    password: ${SPRING_DATASOURCE_PASSWORD:legalnow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
server:
  port: 8080
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-please-override-in-production-min-32-bytes}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  cors:
    allowed-origins:
      - http://localhost:5173
  janus:
    api-url: ${JANUS_API_URL:http://janus-server:8088/janus}
    admin-secret: ${JANUS_ADMIN_SECRET:janusoverlord}
