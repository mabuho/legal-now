name: legal-now

# --------------------------------------
#  LegalNow – Mini Stack (Janus + Whisper)
#  Janus image updated to canyanio/janus-gateway-docker
# --------------------------------------

services:
  janus-server:
    #image: canyan/janus-gateway:0.10.7
    #image: custom-janus
    image: sucwangsr/janus-webrtc-gateway-docker:latest
    container_name: janus-server
    #platform: linux/amd64
    restart: always
    ports:
      - "8188:8188" # WS     (ws://HOST:8188)
      #- "8189:8189"          # WSS    (ws://HOST:8188)
      - "8088:8088" # HTTPS  (wss://HOST:8088)
      - "7088:7088" # HTTPS  (wss://HOST:8088)
      - "10000-10003:10000-10003/udp" # RTP media range
    volumes:
      - ./backend/janus/conf:/usr/local/etc/janus
      - ./backend/janus/recordings:/recordings
      - ./backend/janus/recordings/streams:/recordings/streams
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/janus/info"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 1m # Whisper tarda más en cargar el modelo
    networks:
      - legalnet

  whisper-server:
    #image: quay.io/juit/faster-whisper:latest
    #container_name: whisper-server
    #image: local-faster-whisper
    image: fedirz/faster-whisper-server:latest-cuda
    container_name: whisper-server
    ports:
      - "8000:8000"
    restart: unless-stopped
    #command: >
    #  bash -c "while true; do \
    #    python /app/transcribre.py /recordings && sleep 300; \
    #  done"
    volumes:
      - ./backend/janus/recordings:/recordings
      - ./backend/whisper/transcribe.py:/app/transcribe.py
    depends_on:
      janus-server:
        condition: service_healthy
    #healthcheck:
    #  test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    #  interval: 10s
    #  timeout: 5s
    #  retries: 3
    #  start_period: 2m # Vital: dale tiempo a que cargue el modelo pesado
    networks:
      - legalnet

  rest-api:
    build: ./backend/rest-api
    container_name: rest-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/legalnow
      SPRING_DATASOURCE_USERNAME: legalnow
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-legalnow}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-please-override-in-production-min-32-bytes-12345678}
      JANUS_API_URL: http://janus-server:8088/janus
      JANUS_ADMIN_SECRET: ${JANUS_ADMIN_SECRET:-janusoverlord}
    # TODO: Agregar health check para que webapp dependa en este servicio.
    depends_on:
      postgres:
        condition: service_healthy
      #whisper-server:
      #  condition: service_healthy
    working_dir: /rest-api
    networks:
      - legalnet

  webapp:
    build: ./apps/webapp
    container_name: webapp
    restart: unless-stopped
    ports:
      - "5173:5173" # Map host port 5173 to container port 5173
    environment:
      VITE_JANUS_WSS: ${VITE_JANUS_WSS:-wss://janus}
      VITE_JANUS_API_SECRET: ${JANUS_API_SECRET:-janusrocks}
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080/api/v1}
    depends_on:
      - rest-api
    networks:
      - legalnet
    volumes:
      - ./apps/webapp:/webapp
      - /webapp/node_modules # ← ruta dentro del contenedor, no del host
    working_dir: /webapp

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: legalnow
      POSTGRES_USER: legalnow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legalnow}
    ports:
      - "5432:5432"
    volumes:
      - ./backend/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalnow -d legalnow"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - legalnet

# ---------- Networks ----------
networks:
  legalnet:
    driver: bridge
